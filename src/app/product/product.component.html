
<div class="dashboard-container">
  
  <div class="product-container">


    <h3>Products</h3>
    <br>
    <br>
    <br>



      
    <div class="dropdown">
      <button class="dropbtn">Select Search Options <i class="fa-solid fa-caret-down"></i> </button>
      <div class="dropdown-content">
        <a (click)="selectSearchOption('product')">Search by Product</a>
      </div>
    </div>
  
    <!-- Search boxes -->
    <div *ngIf="selectedOption === 'product'" class="search-boxes">
      <input type="text" placeholder="Product Number">
      <input type="text" placeholder=" Name">
      <input type="text" placeholder=" Category">
      <input type="text" placeholder=" Status">

      <button (click)="search()">Search</button>
    </div>
  </div>
  
  
  <div class="search-results" *ngIf="showSearchResults">
    <h3>2 Search Results</h3>
    <table>
      <thead>
        <tr>
          <th>Product Number</th>
          <th>Product Name</th>
          <th>Product Category</th>
        </tr>
      </thead>
      <tbody>
        <!-- Hardcoded search results -->
        <tr>
          <td>123</td>
          <td>Product A</td>
          <td>Category X</td>
        </tr>
        <tr>
          <td>456</td>
          <td>Product B</td>
          <td>Category Y</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
